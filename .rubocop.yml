plugins:
  - rubocop-factory_bot
  - rubocop-rake
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
Metrics/AbcSize:
  Max: 25
Metrics/MethodLength:
  Max: 50
RSpec/ExampleLength:
  Max: 20
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Max: 10
Rails/I18nLocaleTexts:
  Enabled: false
AllCops:
  NewCops: enable
  Exclude:
    - config/**/*
    - bin/**/*
    - db/**/*
